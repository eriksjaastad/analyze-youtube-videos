categories:
  # Ordered BEFORE ai_automation deliberately. get_category() returns on the FIRST matching
  # category in list order, and ai_automation's "ai" keyword otherwise swallows any self-help
  # video with AI in the title — which is exactly how the Seth Godin episode ("...Before AI
  # Makes The Choice For You") first landed under "🤖 AI & Automation".
  - id: self_improvement
    name: "🧭 Self-Help & Getting Unstuck"
    keywords: ["self-help", "procrastination", "quitting", "mindset", "burnout", "motivation"]
  - id: agentic_workflows
    name: "🚀 Agentic Workflows"
    keywords: ["agentic", "doe", "orchestration", "vibe"]
  - id: ai_automation
    name: "🤖 AI & Automation"
    keywords: ["ai", "automation", "agent", "llm"]
  - id: health_diet
    name: "🥗 Health & Diet"
    keywords: ["diet", "fat", "health", "nutrition", "workout"]
  - id: content_strategy
    name: "💡 Content Strategy & Business"
    keywords: ["business", "strategy", "content", "marketing", "youtube"]
  - id: development
    name: "💻 Development & Engineering"
    keywords: ["python", "code", "engineering", "software", "git"]
  - id: politics_power
    name: "🏛️ Politics & Power"
    # No bare "cult" — get_category() does substring matching, so it would swallow
    # difficult / culture / agriculture / cultivate. The rest are specific enough.
    keywords: ["politics", "political", "authoritarian", "religion", "dominionism", "propaganda"]
default_category:
  id: miscellaneous
  name: "📦 Miscellaneous"
