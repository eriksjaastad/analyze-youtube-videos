# Topic evidence, not routing precedence: category order only controls index display.
# Most signals weigh 1; specific phrases weigh 2-4; broad context weighs 0.25/0.5.
# Title evidence is weighted 3x and total tag evidence is capped at 2. Repeated
# terms and nested phrases do not accumulate. Exact ties use the default.
# Add topics/signals here as coverage grows; never reorder to resolve collisions.
