[project]
name = "analyze-youtube-videos"
version = "0.1.0"
description = "Fetch video transcripts and file graded fact-check reports into library/."
requires-python = ">=3.12"
dependencies = [
    "citecheck @ git+https://github.com/eriksjaastad/citecheck@v0.5.0",
    "pypdf[crypto]==7.1.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
whisper = ["faster-whisper==1.2.1"]

[dependency-groups]
dev = ["pytest==9.0.2"]
